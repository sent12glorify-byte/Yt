# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      publish_at:
        description: 'Optional publication time in UTC (ISO 8601, within four hours)'
        required: false
        default: ''
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the playable game and download
        run: |
          node scripts/build-arena.mjs
          mkdir -p dist/site
          cp public/arena/launch.html dist/site/index.html
          cp dist/Heavenward.html dist/site/Heavenward.html
          cp dist/Heavenward-meta.json dist/site/Heavenward-meta.json
          cp public/arena/gallery.html dist/site/gallery.html
          cp -R public/arena/media dist/site/media
          cd dist/site
          zip -q -r Heavenward.zip index.html Heavenward.html Heavenward-meta.json gallery.html media
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/site'
      - name: Await the requested 9:05 AM New York publication time
        env:
          # One-time release target. Future pushes deploy immediately after this date.
          PUBLISH_AT: ${{ github.event.inputs.publish_at || '2026-10-27T13:05:00Z' }}
        run: python3 .github/scripts/wait-for-publish.py
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
